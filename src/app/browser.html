<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DK Flash Browser</title>
  <link rel="stylesheet" href="browser.css">
</head>
<body>
  <div class="browser-shell">
    <div class="toolbar">
      <button id="back-button" class="nav-button" type="button" title="뒤로" disabled>←</button>
      <button id="forward-button" class="nav-button" type="button" title="앞으로" disabled>→</button>
      <button id="reload-button" class="nav-button" type="button" title="새로고침 (F5 / Ctrl+R)">↻</button>
      <button id="hard-reload-button" class="nav-button hard-reload" type="button" title="강제 새로고침 - 캐시 무시 (Ctrl+F5 / Ctrl+Shift+R)">↻!</button>
      <button id="home-button" class="nav-button" type="button" title="홈 (Alt+Home)">⌂</button>
      <input id="address-input" class="address-input" type="text" spellcheck="false" autocomplete="off" aria-label="주소">
      <button id="bookmark-button" class="nav-button bookmark-toggle" type="button" title="북마크 추가 (Ctrl+D)">☆</button>
    </div>
    <div id="bookmark-bar" class="bookmark-bar" aria-label="북마크 바"></div>
    <div id="browser-placeholder" class="browser-view" aria-label="브라우저 페이지 영역"></div>
  </div>
  <div id="bookmark-context-menu" class="bookmark-context-menu" hidden>
    <button id="bookmark-delete-button" type="button">북마크 삭제</button>
  </div>
  <script src="browser.js"></script>
</body>
</html>
