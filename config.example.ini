; DK Flash Browser external configuration
; Edit config.ini beside DKFlashBrowser.exe. Rebuild is not required.
; Unknown keys are ignored.

[Browser]
; Initial page for startup, Home / Alt+Home, and manually created new tabs.
; If this value is missing or empty, https://html.duckduckgo.com/html is used.
StartUrl=https://html.duckduckgo.com/html

[DefaultBookmarks]
; Used only when UserData\bookmarks.json does not exist.
; Format: BookmarkN=Title|URL
; If the bookmarks file exists but is empty, defaults are NOT recreated.
Bookmark1=DuckDuckGo|https://html.duckduckgo.com/html
Bookmark2=Duck.ai|https://duck.ai/
